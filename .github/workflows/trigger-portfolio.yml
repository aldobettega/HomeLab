name: Trigger Portfolio Update

on:
  push:
    branches:
      - main

jobs:
  ping-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Invia segnale al Portfolio
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PORTFOLIO_TOKEN }}
          repository: aldobettega/aldobettega.github.io
          event-type: rebuild-portfolio
        
